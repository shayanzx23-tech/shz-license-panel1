<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHZ SYSTEM</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%, rgba(255,20,55,.18), transparent 35%),
        #050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
    background-size:40px 40px;
}

.container{
    width:100%;
    max-width:500px;
    padding:24px 16px 40px;
    position:relative;
    z-index:2;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:45px;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo-box{
    width:42px;
    height:42px;
    border-radius:13px;
    background:linear-gradient(145deg,#ff1e45,#750016);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
    font-size:17px;
    box-shadow:0 0 25px rgba(255,20,55,.3);
}

.logo-text h1{
    font-size:17px;
    letter-spacing:2px;
}

.logo-text span{
    color:#777;
    font-size:9px;
    letter-spacing:2px;
}

.control-btn{
    border:1px solid rgba(255,40,70,.35);
    background:rgba(255,20,50,.07);
    color:#ff536c;
    border-radius:11px;
    padding:10px 12px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.control-btn:hover{
    background:#ff1e45;
    color:#fff;
}

/* HERO */

.hero{
    text-align:center;
    margin-bottom:35px;
}

.hero h2{
    font-size:31px;
    letter-spacing:1px;
    margin-bottom:9px;
}

.hero h2 span{
    color:#ff2448;
}

.hero p{
    color:#777;
    font-size:12px;
}

/* CARD */

.card{
    background:rgba(13,13,16,.88);
    border:1px solid rgba(255,255,255,.07);
    border-radius:22px;
    padding:20px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        0 0 40px rgba(255,20,50,.035);
    backdrop-filter:blur(15px);
}

.label{
    display:block;
    color:#999;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1.2px;
    margin-bottom:9px;
}

input{
    width:100%;
    height:49px;
    border-radius:13px;
    border:1px solid #24242a;
    background:#08080a;
    color:white;
    outline:none;
    padding:0 15px;
    font-size:13px;
    transition:.2s;
}

input:focus{
    border-color:#ff2448;
    box-shadow:0 0 0 3px rgba(255,36,72,.08);
}

/* DURATION */

.duration-title{
    margin-top:22px;
}

.duration-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.duration{
    height:48px;
    background:#09090b;
    color:#aaa;
    border:1px solid #232329;
    border-radius:12px;
    font-weight:bold;
    font-size:11px;
    cursor:pointer;
    transition:.2s;
}

.duration:hover{
    border-color:#ff2448;
    color:#fff;
}

.duration.active{
    background:linear-gradient(135deg,#ff2448,#a90021);
    border-color:#ff2448;
    color:white;
    box-shadow:0 5px 20px rgba(255,20,55,.2);
}

.duration:last-child{
    grid-column:span 2;
}

/* CREATE */

.create{
    width:100%;
    height:55px;
    margin-top:20px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#ff2348,#a90020);
    color:white;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(255,20,55,.2);
    transition:.2s;
}

.create:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 35px rgba(255,20,55,.3);
}

.create:active{
    transform:scale(.98);
}

.create.loading{
    opacity:.6;
    pointer-events:none;
}

/* RESULT */

.result{
    display:none;
    margin-top:16px;
    border-radius:17px;
    background:#09090b;
    border:1px solid rgba(255,36,72,.2);
    overflow:hidden;
}

.result.show{
    display:block;
}

.result-head{
    padding:14px 15px;
    border-bottom:1px solid #202026;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.result-head strong{
    font-size:12px;
}

.success{
    color:#45e58b;
    font-size:10px;
    font-weight:bold;
}

.result-row{
    padding:13px 15px;
    border-bottom:1px solid #18181d;
}

.result-row:last-child{
    border-bottom:0;
}

.result-label{
    color:#666;
    font-size:9px;
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.result-value{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.result-value span{
    font-size:12px;
    word-break:break-all;
}

.copy{
    flex-shrink:0;
    background:#15151a;
    border:1px solid #292930;
    color:#aaa;
    border-radius:8px;
    padding:7px 9px;
    font-size:9px;
    cursor:pointer;
}

.copy:hover{
    color:#fff;
    border-color:#ff2448;
}

/* CONTROL PANEL */

.panel{
    display:none;
}

.panel.show{
    display:block;
}

.main.hide{
    display:none;
}

.panel-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
}

.back{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#101014;
    border:1px solid #29292f;
    color:#fff;
    cursor:pointer;
}

.panel-title h2{
    font-size:20px;
}

.panel-title p{
    color:#666;
    font-size:10px;
    margin-top:3px;
}

.search{
    margin-bottom:12px;
}

.filters{
    display:flex;
    gap:7px;
    margin-bottom:15px;
}

.filter{
    flex:1;
    height:37px;
    border:1px solid #24242a;
    background:#0b0b0d;
    color:#777;
    border-radius:9px;
    font-size:9px;
    font-weight:bold;
    cursor:pointer;
}

.filter.active{
    color:#fff;
    border-color:#ff2448;
    background:rgba(255,20,50,.1);
}

.licenses{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#555;
    background:#0b0b0d;
    border:1px solid #19191e;
    border-radius:16px;
}

.empty-icon{
    font-size:28px;
    margin-bottom:10px;
}

.license{
    background:#0b0b0d;
    border:1px solid #1e1e24;
    border-radius:16px;
    padding:15px;
}

.license-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.license-key{
    font-size:11px;
    font-weight:bold;
    word-break:break-all;
}

.badge{
    flex-shrink:0;
    font-size:8px;
    padding:5px 7px;
    border-radius:7px;
    font-weight:bold;
}

.badge.active{
    color:#42e58a;
    background:rgba(66,229,138,.08);
}

.badge.disabled{
    color:#ff536c;
    background:rgba(255,30,60,.08);
}

.badge.expired{
    color:#ffad42;
    background:rgba(255,173,66,.08);
}

.license-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:14px;
}

.info{
    background:#08080a;
    padding:9px;
    border-radius:9px;
}

.info small{
    display:block;
    color:#555;
    font-size:8px;
    margin-bottom:4px;
}

.info span{
    font-size:10px;
    color:#bbb;
    word-break:break-all;
}

.license-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.action{
    flex:1;
    height:34px;
    border:1px solid #25252b;
    background:#111116;
    color:#aaa;
    border-radius:8px;
    font-size:9px;
    font-weight:bold;
    cursor:pointer;
}

.action:hover{
    color:#fff;
    border-color:#ff2448;
}

.action.danger{
    color:#ff536c;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translate(-50%,20px);
    background:#15151a;
    border:1px solid #292930;
    padding:11px 16px;
    border-radius:11px;
    font-size:11px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:99;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.footer{
    text-align:center;
    color:#333;
    font-size:8px;
    letter-spacing:1px;
    margin-top:25px;
}

@media(max-width:380px){
    .hero h2{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- MAIN -->
    <div id="main" class="main">

        <div class="top">
            <div class="logo">
                <div class="logo-box">SHZ</div>
                <div class="logo-text">
                    <h1>SHZ SYSTEM</h1>
                    <span>LICENSE MANAGER</span>
                </div>
            </div>

            <button class="control-btn" onclick="openPanel()">
                CONTROL
            </button>
        </div>

        <div class="hero">
            <h2>CREATE <span>LICENSE</span></h2>
            <p>Generate a secure SHZ license key</p>
        </div>

        <div class="card">

            <label class="label">ADMIN PASSWORD</label>
            <input
                id="adminPassword"
                type="password"
                placeholder="Enter admin password"
            >

            <label class="label duration-title">LICENSE DURATION</label>

            <div class="duration-grid">

                <button class="duration active"
                        data-duration="1day"
                        onclick="selectDuration(this)">
                    1 DAY
                </button>

                <button class="duration"
                        data-duration="1week"
                        onclick="selectDuration(this)">
                    1 WEEK
                </button>

                <button class="duration"
                        data-duration="1month"
                        onclick="selectDuration(this)">
                    1 MONTH
                </button>

                <button class="duration"
                        data-duration="1year"
                        onclick="selectDuration(this)">
                    1 YEAR
                </button>

                <button class="duration"
                        data-duration="unlimited"
                        onclick="selectDuration(this)">
                    UNLIMITED
                </button>

            </div>

            <button id="createButton"
                    class="create"
                    onclick="createLicense()">
                CREATE LICENSE
            </button>

            <div id="result" class="result">

                <div class="result-head">
                    <strong>LICENSE CREATED</strong>
                    <span class="success">● SUCCESS</span>
                </div>

                <div class="result-row">
                    <div class="result-label">License Key</div>
                    <div class="result-value">
                        <span id="licenseKey">—</span>
                        <button class="copy" onclick="copyText('licenseKey')">
                            COPY
                        </button>
                    </div>
                </div>

                <div class="result-row">
                    <div class="result-label">Topic</div>
                    <div class="result-value">
                        <span id="topic">—</span>
                        <button class="copy" onclick="copyText('topic')">
                            COPY
                        </button>
                    </div>
                </div>

                <div class="result-row">
                    <div class="result-label">Duration</div>
                    <div class="result-value">
                        <span id="durationResult">—</span>
                    </div>
                </div>

                <div class="result-row">
                    <div class="result-label">Expiration</div>
                    <div class="result-value">
                        <span id="expires">—</span>
                    </div>
                </div>

            </div>

        </div>

        <div class="footer">
            SHZ SYSTEM • SECURE LICENSE MANAGEMENT
        </div>

    </div>


    <!-- CONTROL PANEL -->
    <div id="panel" class="panel">

        <div class="panel-top">

            <button class="back" onclick="closePanel()">‹</button>

            <div class="panel-title">
                <h2>Control Panel</h2>
                <p>Manage generated licenses</p>
            </div>

        </div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search license or topic..."
            oninput="renderLicenses()"
        >

        <div class="filters">

            <button class="filter active"
                    onclick="setFilter('all',this)">
                ALL
            </button>

            <button class="filter"
                    onclick="setFilter('active',this)">
                ACTIVE
            </button>

            <button class="filter"
                    onclick="setFilter('disabled',this)">
                DISABLED
            </button>

            <button class="filter"
                    onclick="setFilter('expired',this)">
                EXPIRED
            </button>

        </div>

        <div id="licenses" class="licenses"></div>

    </div>

</div>

<div id="toast" class="toast"></div>


<script>

const FUNCTION_URL =
"https://glkgppmuwaaemvodebgc.supabase.co/functions/v1/create-license";

let selectedDuration = "1day";
let currentFilter = "all";

let licenses =
JSON.parse(localStorage.getItem("shz_licenses") || "[]");


/* DURATION */

function selectDuration(button){

    document.querySelectorAll(".duration")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    selectedDuration =
        button.dataset.duration;
}


/* CREATE */

async function createLicense(){

    const password =
        document.getElementById("adminPassword").value.trim();

    if(!password){
        showToast("Enter admin password");
        return;
    }

    const button =
        document.getElementById("createButton");

    button.classList.add("loading");
    button.innerText = "CREATING...";

    try{

        const response =
            await fetch(FUNCTION_URL,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    admin_secret:password,
                    duration:selectedDuration
                })
            });

        const data = await response.json();

        if(!response.ok || !data.success){

            if(data.error === "UNAUTHORIZED"){
                throw new Error("Admin password is incorrect.");
            }

            throw new Error(
                data.error || "Failed to create license."
            );
        }


        /* SAVE LOCALLY FOR CONTROL PANEL */

        const license = {
            id:Date.now(),
            license_key:data.license_key,
            topic:data.topic,
            duration:data.duration || selectedDuration,
            expires_at:data.expires_at || null,
            disabled:false,
            created_at:new Date().toISOString()
        };

        licenses.unshift(license);

        localStorage.setItem(
            "shz_licenses",
            JSON.stringify(licenses)
        );


        /* SHOW RESULT */

        document.getElementById("licenseKey").innerText =
            data.license_key || "—";

        document.getElementById("topic").innerText =
            data.topic || "—";

        document.getElementById("durationResult").innerText =
            data.duration || selectedDuration;

        document.getElementById("expires").innerText =
            formatDate(data.expires_at);

        document.getElementById("result")
            .classList.add("show");

        showToast("License created successfully");

    }catch(error){

        showToast(error.message);

    }finally{

        button.classList.remove("loading");
        button.innerText = "CREATE LICENSE";
    }
}


/* COPY */

async function copyText(id){

    const text =
        document.getElementById(id).innerText;

    if(!text || text === "—") return;

    try{

        await navigator.clipboard.writeText(text);

        showToast("Copied");

    }catch{

        showToast("Copy failed");

    }
}


/* PANEL */

function openPanel(){

    document.getElementById("main")
        .classList.add("hide");

    document.getElementById("panel")
        .classList.add("show");

    renderLicenses();
}


function closePanel(){

    document.getElementById("panel")
        .classList.remove("show");

    document.getElementById("main")
        .classList.remove("hide");
}


/* FILTER */

function setFilter(filter,button){

    currentFilter = filter;

    document.querySelectorAll(".filter")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderLicenses();
}


/* STATUS */

function getStatus(license){

    if(license.disabled)
        return "disabled";

    if(
        license.expires_at &&
        new Date(license.expires_at) < new Date()
    )
        return "expired";

    return "active";
}


/* DATE */

function formatDate(date){

    if(!date)
        return "Never";

    const d = new Date(date);

    if(isNaN(d.getTime()))
        return date;

    return d.toLocaleString();
}


/* RENDER */

function renderLicenses(){

    const container =
        document.getElementById("licenses");

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();

    let list = [...licenses];

    list = list.filter(license => {

        const status =
            getStatus(license);

        const matchesFilter =
            currentFilter === "all" ||
            status === currentFilter;

        const matchesSearch =
            !search ||
            String(license.license_key)
                .toLowerCase()
                .includes(search) ||
            String(license.topic)
                .toLowerCase()
                .includes(search);

        return matchesFilter && matchesSearch;
    });


    if(!list.length){

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⌁</div>
                No licenses found
            </div>
        `;

        return;
    }


    container.innerHTML =
        list.map(license => {

            const status =
                getStatus(license);

            const statusText =
                status.toUpperCase();

            return `
                <div class="license">

                    <div class="license-top">

                        <div class="license-key">
                            ${escapeHtml(license.license_key)}
                        </div>

                        <span class="badge ${status}">
                            ${statusText}
                        </span>

                    </div>

                    <div class="license-info">

                        <div class="info">
                            <small>TOPIC</small>
                            <span>
                                ${escapeHtml(license.topic)}
                            </span>
                        </div>

                        <div class="info">
                            <small>DURATION</small>
                            <span>
                                ${escapeHtml(license.duration)}
                            </span>
                        </div>

                        <div class="info">
                            <small>EXPIRES</small>
                            <span>
                                ${formatDate(license.expires_at)}
                            </span>
                        </div>

                        <div class="info">
                            <small>CREATED</small>
                            <span>
                                ${formatDate(license.created_at)}
                            </span>
                        </div>

                    </div>

                    <div class="license-actions">

                        <button
                            class="action"
                            onclick="toggleLicense(${license.id})">
                            ${license.disabled ? "ACTIVATE" : "DISABLE"}
                        </button>

                        <button
                            class="action"
                            onclick="copyValue('${escapeAttr(license.license_key)}')">
                            COPY KEY
                        </button>

                        <button
                            class="action danger"
                            onclick="deleteLicense(${license.id})">
                            DELETE
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}


/* TOGGLE */

function toggleLicense(id){

    const license =
        licenses.find(x => x.id === id);

    if(!license) return;

    license.disabled =
        !license.disabled;

    localStorage.setItem(
        "shz_licenses",
        JSON.stringify(licenses)
    );

    renderLicenses();

    showToast(
        license.disabled
        ? "License disabled"
        : "License activated"
    );
}


/* DELETE */

function deleteLicense(id){

    const index =
        licenses.findIndex(x => x.id === id);

    if(index === -1) return;

    licenses.splice(index,1);

    localStorage.setItem(
        "shz_licenses",
        JSON.stringify(licenses)
    );

    renderLicenses();

    showToast("License removed from panel");
}


/* COPY VALUE */

function copyValue(value){

    navigator.clipboard.writeText(value)
        .then(() => showToast("Copied"))
        .catch(() => showToast("Copy failed"));
}


/* ESCAPE */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeAttr(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* TOAST */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {
            toast.classList.remove("show");
        },2200);
}


/* INITIAL */

renderLicenses();

</script>

</body>
</html>
