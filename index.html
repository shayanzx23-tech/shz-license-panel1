<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SHZ SYSTEM</title><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(255,20,55,.18),transparent 35%),#050505;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:40px 40px}.container{width:100%;max-width:500px;padding:24px 16px 40px;position:relative;z-index:2}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.logo{display:flex;align-items:center;gap:11px}.logo-box{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#ff1e45,#750016);display:flex;justify-content:center;align-items:center;font-weight:900;font-size:14px;box-shadow:0 0 25px rgba(255,20,55,.3)}.logo-text h1{font-size:17px;letter-spacing:2px}.logo-text span{color:#777;font-size:9px;letter-spacing:2px}.control-btn{border:1px solid rgba(255,40,70,.35);background:rgba(255,20,50,.07);color:#ff536c;border-radius:11px;padding:10px 12px;font-size:10px;font-weight:bold;cursor:pointer}.hero{text-align:center;margin-bottom:35px}.hero h2{font-size:31px;letter-spacing:1px;margin-bottom:9px}.hero h2 span{color:#ff2448}.hero p{color:#777;font-size:12px}.card{background:rgba(13,13,16,.88);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.5),0 0 40px rgba(255,20,50,.035);backdrop-filter:blur(15px)}.label{display:block;color:#999;font-size:10px;font-weight:bold;letter-spacing:1.2px;margin-bottom:9px}input{width:100%;height:49px;border-radius:13px;border:1px solid #24242a;background:#08080a;color:white;outline:none;padding:0 15px;font-size:13px}input:focus{border-color:#ff2448;box-shadow:0 0 0 3px rgba(255,36,72,.08)}.duration-title{margin-top:22px}.duration-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.duration{height:48px;background:#09090b;color:#aaa;border:1px solid #232329;border-radius:12px;font-weight:bold;font-size:11px;cursor:pointer}.duration.active{background:linear-gradient(135deg,#ff2448,#a90021);border-color:#ff2448;color:#fff;box-shadow:0 5px 20px rgba(255,20,55,.2)}.duration:last-child{grid-column:span 2}.create{width:100%;height:55px;margin-top:20px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff2348,#a90020);color:#fff;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 10px 30px rgba(255,20,55,.2)}.create.loading{opacity:.6;pointer-events:none}.result{display:none;margin-top:16px;border-radius:17px;background:#09090b;border:1px solid rgba(255,36,72,.2);overflow:hidden}.result.show{display:block}.result-head{padding:14px 15px;border-bottom:1px solid #202026;display:flex;justify-content:space-between}.success{color:#45e58b;font-size:10px;font-weight:bold}.result-row{padding:13px 15px;border-bottom:1px solid #18181d}.result-row:last-child{border:0}.result-label{color:#666;font-size:9px;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}.result-value{display:flex;align-items:center;justify-content:space-between;gap:8px}.result-value span{font-size:12px;word-break:break-all}.copy{background:#15151a;border:1px solid #292930;color:#aaa;border-radius:8px;padding:7px 9px;font-size:9px;cursor:pointer}.panel{display:none}.panel.show{display:block}.main.hide{display:none}.panel-top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{width:40px;height:40px;border-radius:12px;background:#101014;border:1px solid #29292f;color:#fff;cursor:pointer}.panel-title h2{font-size:20px}.panel-title p{color:#666;font-size:10px;margin-top:3px}.search{margin-bottom:12px}.filters{display:flex;gap:7px;margin-bottom:15px}.filter{flex:1;height:37px;border:1px solid #24242a;background:#0b0b0d;color:#777;border-radius:9px;font-size:9px;font-weight:bold;cursor:pointer}.filter.active{color:#fff;border-color:#ff2448;background:rgba(255,20,50,.1)}.licenses{display:flex;flex-direction:column;gap:10px}.empty{text-align:center;padding:45px 20px;color:#555;background:#0b0b0d;border:1px solid #19191e;border-radius:16px}.license{background:#0b0b0d;border:1px solid #1e1e24;border-radius:16px;padding:15px}.license-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.license-key{font-size:11px;font-weight:bold;word-break:break-all}.badge{font-size:8px;padding:5px 7px;border-radius:7px;font-weight:bold}.badge.active{color:#42e58a;background:rgba(66,229,138,.08)}.badge.disabled{color:#ff536c;background:rgba(255,30,60,.08)}.badge.expired{color:#ffad42;background:rgba(255,173,66,.08)}.license-info{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.info{background:#08080a;padding:9px;border-radius:9px}.info small{display:block;color:#555;font-size:8px;margin-bottom:4px}.info span{font-size:10px;color:#bbb;word-break:break-all}.license-actions{display:flex;gap:7px;margin-top:12px}.action{flex:1;height:34px;border:1px solid #25252b;background:#111116;color:#aaa;border-radius:8px;font-size:9px;font-weight:bold;cursor:pointer}.action.danger{color:#ff536c}.footer{text-align:center;color:#333;font-size:8px;letter-spacing:1px;margin-top:25px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#15151a;border:1px solid #292930;padding:11px 16px;border-radius:11px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="container"><div id="main" class="main"><div class="top"><div class="logo"><div class="logo-box">SHZ</div><div class="logo-text"><h1>SHZ SYSTEM</h1><span>LICENSE MANAGER</span></div></div><button class="control-btn" onclick="openPanel()">CONTROL</button></div><div class="hero"><h2>CREATE <span>LICENSE</span></h2><p>Generate a secure SHZ license key</p></div><div class="card"><label class="label">ADMIN PASSWORD</label><input id="adminPassword" type="password" placeholder="Enter admin password"><label class="label duration-title">LICENSE DURATION</label><div class="duration-grid"><button class="duration active" data-duration="1day" onclick="selectDuration(this)">1 DAY</button><button class="duration" data-duration="1week" onclick="selectDuration(this)">1 WEEK</button><button class="duration" data-duration="1month" onclick="selectDuration(this)">1 MONTH</button><button class="duration" data-duration="1year" onclick="selectDuration(this)">1 YEAR</button><button class="duration" data-duration="unlimited" onclick="selectDuration(this)">UNLIMITED</button></div><button id="createButton" class="create" onclick="createLicense()">CREATE LICENSE</button><div id="result" class="result"><div class="result-head"><strong>LICENSE CREATED</strong><span class="success">● SUCCESS</span></div><div class="result-row"><div class="result-label">License Key</div><div class="result-value"><span id="licenseKey">—</span><button class="copy" onclick="copyText('licenseKey')">COPY</button></div></div><div class="result-row"><div class="result-label">Topic</div><div class="result-value"><span id="topic">—</span><button class="copy" onclick="copyText('topic')">COPY</button></div></div><div class="result-row"><div class="result-label">Duration</div><div class="result-value"><span id="durationResult">—</span></div></div><div class="result-row"><div class="result-label">Expiration</div><div class="result-value"><span id="expires">—</span></div></div></div></div><div class="footer">SHZ SYSTEM • SECURE LICENSE MANAGEMENT</div></div><div id="panel" class="panel"><div class="panel-top"><button class="back" onclick="closePanel()">‹</button><div class="panel-title"><h2>Control Panel</h2><p>Manage real licenses</p></div></div><input id="search" class="search" type="text" placeholder="Search license or topic..." oninput="renderLicenses()"><div class="filters"><button class="filter active" onclick="setFilter('all',this)">ALL</button><button class="filter" onclick="setFilter('active',this)">ACTIVE</button><button class="filter" onclick="setFilter('disabled',this)">DISABLED</button><button class="filter" onclick="setFilter('expired',this)">EXPIRED</button></div><div id="licenses" class="licenses"></div></div></div><div id="toast" class="toast"></div><script>const FUNCTION_URL="https://glkgppmuwaaemvodebgc.supabase.co/functions/v1/create-license";const MANAGE_URL="https://glkgppmuwaaemvodebgc.supabase.co/functions/v1/manage-licenses";let selectedDuration="1day";let currentFilter="all";let licenses=[];function selectDuration(b){document.querySelectorAll(".duration").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedDuration=b.dataset.duration}async function createLicense(){const password=document.getElementById("adminPassword").value.trim();if(!password)return showToast("Enter admin password");const b=document.getElementById("createButton");b.classList.add("loading");b.innerText="CREATING...";try{const r=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({admin_secret:password,duration:selectedDuration})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error==="UNAUTHORIZED"?"Admin password is incorrect":d.error||"Failed to create license");document.getElementById("licenseKey").innerText=d.license_key||"—";document.getElementById("topic").innerText=d.topic||"—";document.getElementById("durationResult").innerText=d.duration||selectedDuration;document.getElementById("expires").innerText=formatDate(d.expires_at);document.getElementById("result").classList.add("show");showToast("License created successfully")}catch(e){showToast(e.message)}finally{b.classList.remove("loading");b.innerText="CREATE LICENSE"}}async function openPanel(){document.getElementById("main").classList.add("hide");document.getElementById("panel").classList.add("show");await loadLicenses()}function closePanel(){document.getElementById("panel").classList.remove("show");document.getElementById("main").classList.remove("hide")}async function loadLicenses(){const password=document.getElementById("adminPassword").value.trim();if(!password){showToast("Enter admin password first");closePanel();return}const box=document.getElementById("licenses");box.innerHTML='<div class="empty">Loading licenses...</div>';try{const r=await fetch(MANAGE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({admin_secret:password,action:"list"})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error==="UNAUTHORIZED"?"Admin password is incorrect":d.error||"Failed to load licenses");licenses=d.licenses||[];renderLicenses()}catch(e){box.innerHTML='<div class="empty">Could not load licenses</div>';showToast(e.message)}}function setFilter(f,b){currentFilter=f;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderLicenses()}function getStatus(x){if(!x.is_active)return"disabled";if(x.expires_at&&new Date(x.expires_at)<new Date())return"expired";return"active"}function formatDate(v){if(!v)return"Never";const d=new Date(v);return isNaN(d)?v:d.toLocaleString()}function renderLicenses(){const box=document.getElementById("licenses"),q=(document.getElementById("search").value||"").toLowerCase().trim();let list=licenses.filter(x=>{const s=getStatus(x);return(currentFilter==="all"||s===currentFilter)&&(!q||String(x.license_key||"").toLowerCase().includes(q)||String(x.topic||"").toLowerCase().includes(q))});if(!list.length){box.innerHTML='<div class="empty">No licenses found</div>';return}box.innerHTML=list.map(x=>{const s=getStatus(x);return'<div class="license"><div class="license-top"><div class="license-key">'+esc(x.license_key)+'</div><span class="badge '+s+'">'+s.toUpperCase()+'</span></div><div class="license-info"><div class="info"><small>TOPIC</small><span>'+esc(x.topic||"—")+'</span></div><div class="info"><small>DEVICE</small><span>'+esc(x.device_id||"Not linked")+'</span></div><div class="info"><small>EXPIRES</small><span>'+formatDate(x.expires_at)+'</span></div><div class="info"><small>CREATED</small><span>'+formatDate(x.created_at)+'</span></div></div><div class="license-actions"><button class="action" onclick="toggleLicense(\''+attr(x.license_key)+'\')">'+(x.is_active?"DISABLE":"ACTIVATE")+'</button><button class="action" onclick="copyValue(\''+attr(x.license_key)+'\')">COPY KEY</button><button class="action danger" onclick="deleteLicense(\''+attr(x.license_key)+'\')">DELETE</button></div></div>'}).join("")}async function toggleLicense(key){await manage("toggle",key)}async function deleteLicense(key){if(!confirm("Delete this license permanently?"))return;await manage("delete",key)}async function manage(action,key){const password=document.getElementById("adminPassword").value.trim();if(!password)return showToast("Enter admin password");try{const r=await fetch(MANAGE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({admin_secret:password,action:action,license_key:key})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error==="UNAUTHORIZED"?"Admin password is incorrect":d.error||"Operation failed");showToast(action==="delete"?"License deleted":d.is_active?"License activated":"License disabled");await loadLicenses()}catch(e){showToast(e.message)}}async function copyText(id){copyValue(document.getElementById(id).innerText)}function copyValue(v){if(!v||v==="—")return;navigator.clipboard.writeText(v).then(()=>showToast("Copied")).catch(()=>showToast("Copy failed"))}function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function attr(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}let tt;function showToast(m){const t=document.getElementById("toast");t.innerText=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}</script></body></html>
